# DRUG TOX PRO — Local deployment with Docker Desktop
# Usage: docker compose up --build
# Open: http://localhost:8080

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: drug-tox-pro-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: drug-tox-pro-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    depends_on:
      backend:
        condition: service_healthy
