server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # API → FastAPI backend (no cache on API responses)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Static assets — never cache JS/CSS (prevents stale UI / false 304 issues)
    location /static/js/ {
        alias /usr/share/nginx/html/static/js/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /static/css/ {
        alias /usr/share/nginx/html/static/css/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Dashboard UI — always revalidate HTML
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
